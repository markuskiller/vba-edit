# Publishes vba-edit and satellite packages to PyPI / TestPyPI using Trusted Publishers (OIDC).
# Requires Trusted Publisher configuration on PyPI for each package:
#   - vba-edit, excel-vba, word-vba, powerpoint-vba, access-vba
# See: https://docs.pypi.org/trusted-publishers/creating-a-project-through-oidc/
name: Publish to PyPI and Test PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish satellite packages for (for example: 0.5.1)"
        required: true
        type: string

permissions:
  contents: read       # Required to checkout code
  id-token: write      # Required for Trusted Publishers (OIDC)
  attestations: write  # Required for PEP 740 attestations

jobs:

  lint:
    uses: ./.github/workflows/lint.yaml
  test:
    uses: ./.github/workflows/test.yaml

  publish:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Build the package
      run: uv build

    - name: Verify package
      run: uv run --with twine twine check dist/*

    - name: Security audit
      run: uv run --with pip-audit pip-audit

    - name: Publish to Test PyPI
      if: startsWith(github.ref, 'refs/tags/v') && github.event.release.prerelease
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/
        attestations: true

    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        attestations: true

  publish-satellites:
    if: github.event_name == 'release'
    needs: [publish]
    runs-on: ubuntu-latest
    env:
      SATELLITE_PKGS: "excel-vba word-vba powerpoint-vba access-vba"
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Sync satellite versions to release tag
      run: |
        python - <<'EOF'
        import os
        import re
        from pathlib import Path

        tag = os.environ["RELEASE_TAG"]
        version = tag.lstrip("v")
        constraint = f"vba-edit=={version}"

        for pkg in os.environ["SATELLITE_PKGS"].split():
            path = Path(f"packages/{pkg}/pyproject.toml")
            content = path.read_text()
            content = re.sub(r'^version = "[^"]*"', f'version = "{version}"', content, flags=re.MULTILINE)
            content = re.sub(r'"vba-edit(?:==[^"]+)?"', f'"{constraint}"', content)
            path.write_text(content)
            print(f"Updated {pkg} to {version} with {constraint}")
        EOF

    - name: Build satellite packages
      run: |
        mkdir -p satellite-dist
        for pkg in $SATELLITE_PKGS; do
          rm -rf packages/$pkg/dist
          uv build packages/$pkg
          cp packages/$pkg/dist/* satellite-dist/
        done

    - name: Verify satellite packages
      run: uv run --with twine twine check satellite-dist/*

    - name: Publish satellites to Test PyPI
      if: startsWith(github.ref, 'refs/tags/v') && github.event.release.prerelease
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        repository-url: https://test.pypi.org/legacy/
        packages-dir: satellite-dist/
        attestations: true

    - name: Publish satellites to PyPI
      if: startsWith(github.ref, 'refs/tags/v') && !github.event.release.prerelease
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        packages-dir: satellite-dist/
        attestations: true

  publish-satellites-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SATELLITE_PKGS: "excel-vba word-vba powerpoint-vba access-vba"
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Sync satellite versions to release version
      run: |
        python - <<'EOF'
        import os
        import re
        from pathlib import Path

        version = os.environ["RELEASE_VERSION"].lstrip("v")
        constraint = f"vba-edit=={version}"

        for pkg in os.environ["SATELLITE_PKGS"].split():
            path = Path(f"packages/{pkg}/pyproject.toml")
            content = path.read_text()
            content = re.sub(r'^version = "[^"]*"', f'version = "{version}"', content, flags=re.MULTILINE)
            content = re.sub(r'"vba-edit(?:==[^"]+)?"', f'"{constraint}"', content)
            path.write_text(content)
            print(f"Updated {pkg} to {version} with {constraint}")
        EOF

    - name: Build satellite packages
      run: |
        mkdir -p satellite-dist
        for pkg in $SATELLITE_PKGS; do
          rm -rf packages/$pkg/dist
          uv build packages/$pkg
          cp packages/$pkg/dist/* satellite-dist/
        done

    - name: Verify satellite packages
      run: uv run --with twine twine check satellite-dist/*

    - name: Publish satellites to PyPI
      uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
      with:
        packages-dir: satellite-dist/
        attestations: true

